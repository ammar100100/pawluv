<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawluv — Login</title><style>body{margin:0;background:#f5f1eb;color:#171614;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,88vw);background:#fff;padding:36px;border:1px solid #ded9d1}h1{font:400 42px Georgia,serif;margin:0 0 8px}.muted{color:#777;line-height:1.6;font-size:13px}label{display:block;font-size:11px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #ccc;box-sizing:border-box}.btn{width:100%;margin-top:20px;padding:14px;background:#171614;color:#fff;border:0;cursor:pointer}.link{display:block;text-align:center;margin-top:18px;color:#555;font-size:12px}.msg{margin-top:15px;font-size:12px}</style></head><body><main class="box"><h1>PAWLUV</h1><p class="muted">Sign in to your Pawluv account.</p><form id="form"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn">LOGIN</button></form><a class="link" href="/signup/">Create an account</a><a class="link" href="/">Back to Pawluv</a><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://pmhjanbcwifyjqhyldni.supabase.co';const SUPABASE_KEY='sb_publishable_nag4MWRF1AprHCdc-cCkjA_XNTnHM2';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent=error.message;return}const {data:p}=await sb.from('profiles').select('role').eq('id',data.user.id).maybeSingle();location.href=p?.role==='admin'?'/admin/':'/';});</script></body></html>
