s.filter(p=>(p.categories||[]).some(x=>(x.id||x.slug||x.name)===c.k)))};filters.appendChild(b)});render(products)}).catch(()=>grid.innerHTML='<p>Products could not be loaded right now.</p>');</script></body></html>
