name: Pawluv Repair Live Homepage
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO LIVE HOME REPAIR') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated pre-page markup and harden mobile layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Keep only the real document shell; discard any stray markup before <body>.
          if '<body' not in s or '</body>' not in s:
              raise SystemExit('invalid html shell')
          pre, rest = s.split('<body',1)
          body_attrs, body = rest.split('>',1)
          # The screenshot shows a large stray block before the promo. Rebuild body content
          # starting at the first real promo and ending at the footer.
          promo=body.find('<a class="promo"')
          footer=body.rfind('</footer>')
          if promo < 0 or footer < 0:
              raise SystemExit('expected promo/footer not found')
          footer += len('</footer>')
          clean_body=body[promo:footer]
          # Remove duplicate how-order style blocks generated by earlier repairs.
          clean_body=re.sub(r'(?:<style id="pawluv-how-order-css">.*?</style>\s*){2,}', '<style id="pawluv-how-order-css">.pawluv-how-order{background:linear-gradient(180deg,#fffafa 0%,#fff 100%);padding:34px 0 48px;border-top:1px solid #f4e9ed;border-bottom:1px solid #f4e9ed}.pawluv-how-order .howWrap{max-width:1240px;margin:0 auto;padding:0 20px}.pawluv-how-order img{display:block;width:100%;height:auto;max-width:1200px;margin:0 auto;border-radius:22px;box-shadow:0 12px 35px rgba(37,38,63,.07)}@media(max-width:700px){.pawluv-how-order{padding:24px 0 34px}.pawluv-how-order .howWrap{padding:0 12px}.pawluv-how-order img{border-radius:14px}}</style>', clean_body, flags=re.S)
          # Remove mobile polish copies; add one deterministic version below.
          clean_body=re.sub(r'<style id="pawluv-mobile-polish">.*?</style>\s*', '', clean_body, flags=re.S)
          mobile='''<style id="pawluv-mobile-polish-final">
          html,body{width:100%;max-width:100%;overflow-x:hidden}
          *{box-sizing:border-box}
          img{max-width:100%;height:auto}
          .container{width:100%;max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
          .hero{overflow:hidden}
          .heroCard{max-width:520px}
          .categoryNav{position:relative!important;top:auto!important;width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
          .categoryNavInner{width:max-content;min-width:100%}
          .reviewTrack{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
          .review{flex:0 0 330px}
          @media(max-width:900px){
            .nav{height:68px;padding:0 18px}
            .navlinks{display:none}
            .actions{gap:10px;font-size:11px}
            .logo img{width:165px;max-height:48px}
            .hero{min-height:600px;padding:30px 16px;background-position:center}
            .heroCard{width:100%;max-width:560px;padding:32px 26px;margin:0 auto}
            .hero h1{font-size:39px}
            .hero p{font-size:16px}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
            .card{min-width:0;padding:8px}
            .card h3{font-size:14px;overflow-wrap:anywhere}
          }
          @media(max-width:560px){
            .promo{height:38px;font-size:10px;padding:0 8px;text-align:center}
            .nav{height:60px;padding:0 12px}
            .logo img{width:142px;max-height:42px}
            .actions{font-size:10px;gap:6px}
            .hero{min-height:540px;padding:20px 12px}
            .heroCard{padding:27px 20px;width:100%;max-width:420px}
            .hero h1{font-size:32px;line-height:1.04}
            .hero p{font-size:14px}
            .heroCard li{font-size:13px;margin:10px 0}
            .heroCard .btn{width:100%;padding:13px 18px}
            .dealCountdown{height:54px;gap:3px;padding:0 7px;overflow:hidden}
            .dealLead,.dealEnd{font-size:9px}
            .dealUnit{width:31px;height:34px}
            .dealUnit b{font-size:12px}.dealUnit span{font-size:6px}.dealColon{font-size:12px}
            .categoryNavInner{min-width:max-content;justify-content:flex-start;gap:7px;padding:10px 12px}
            .pill{padding:8px 13px;font-size:10px}
            .section{padding:38px 0}
            .container{padding-left:12px;padding-right:12px}
            .homeHead h2{font-size:26px}.homeHead p{font-size:12px;line-height:1.45}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
            .card{padding:6px;border-radius:12px}.card img{border-radius:8px}
            .card h3{font-size:12px;line-height:1.25;margin:7px 2px}
            .price{font-size:11px;margin:7px 2px 9px}.price b{font-size:13px}
            .card .btn{font-size:10px;padding:9px 5px;border-radius:22px}
            .reviewsHead h2{font-size:28px}.reviewsHead p{font-size:12px}
            .reviewTrack{gap:12px;padding:3px 1px 14px}.review{flex-basis:280px;width:280px}
            .review>img{height:250px}.reviewBody{padding:14px 15px 17px}.reviewBody p{font-size:12px}
            .pawluv-how-order{padding:18px 0 26px}.pawluv-how-order .howWrap{padding:0 8px}
          }
          </style>'''
          clean_body=clean_body.replace('</footer>', '</footer>'+mobile, 1)
          # Keep the existing head, but remove any old mobile style so the final rules win cleanly.
          pre=re.sub(r'<style id="pawluv-mobile-polish-final">.*?</style>', '', pre, flags=re.S)
          p.write_text(pre+'<body'+body_attrs+'>'+clean_body+'</body>',encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO LIVE HOME REPAIR: remove stray markup and fix mobile"
          git push
