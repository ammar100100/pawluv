name: Pawluv Mobile Responsive Polish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO MOBILE POLISH') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium mobile layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="pawluv-mobile-polish">.*?</style>', '', s, flags=re.S)
          css='''<style id="pawluv-mobile-polish">
          html{overflow-x:hidden}
          body{overflow-x:hidden;width:100%;-webkit-text-size-adjust:100%}
          img{max-width:100%;height:auto}
          .container{width:100%;max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
          .hero{overflow:hidden}
          .heroCard{width:min(520px,100%)}
          .dealCountdown{overflow:hidden}
          .categoryNav{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
          .categoryNavInner{width:max-content;min-width:100%;justify-content:center}
          .reviewTrack{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
          .review{flex:0 0 330px}
          .grid{width:100%}
          .card{min-width:0}
          .card h3{overflow-wrap:anywhere}
          .pawluv-how-order{width:100%;overflow:hidden}
          .pawluv-how-order .howWrap{width:100%}
          .pawluv-how-order img{width:100%;height:auto}
          @media(max-width:900px){
            .nav{padding:0 18px;height:68px}
            .logo img{width:165px;max-height:48px}
            .actions{gap:10px;font-size:11px;font-weight:800}
            .hero{min-height:600px;padding:30px 16px;background-position:center center}
            .heroCard{padding:32px 26px;border-radius:18px;margin:0 auto}
            .hero h1{font-size:39px}
            .hero p{font-size:16px}
            .section{padding:46px 0}
            .container{padding-left:16px;padding-right:16px}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
            .card{padding:8px;border-radius:14px}
            .card h3{font-size:14px}
            .price{font-size:13px;margin:8px 0 10px}
            .card .btn{font-size:12px;padding:11px 8px}
            .homeHead{display:block;margin-bottom:20px}
            .homeHead h2{font-size:30px}
            .count{margin-top:8px}
            .reviewsHead h2{font-size:34px}
            .reviewsHead p{font-size:14px}
            .review{flex-basis:300px;width:300px}
            .review>img{height:275px}
            .dealCountdown{height:60px;gap:5px;padding:0 10px}
            .dealLead,.dealEnd{font-size:11px}
            .dealUnit{width:38px;height:38px}
            .dealUnit b{font-size:14px}
            .dealUnit span{font-size:7px}
            .dealColon{font-size:15px}
          }
          @media(max-width:560px){
            .promo{height:38px;font-size:10px;letter-spacing:.1px;padding:0 8px;text-align:center}
            .nav{height:60px;padding:0 12px}
            .logo img{width:142px;max-height:42px}
            .actions{font-size:10px;gap:6px}
            .hero{min-height:540px;padding:20px 12px;background-position:62% center}
            .heroCard{padding:27px 20px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
            .heroCard .stars{font-size:15px}
            .hero h1{font-size:32px;line-height:1.04;margin:14px 0}
            .hero p{font-size:14px;line-height:1.5}
            .heroCard ul{margin:17px 0}
            .heroCard li{font-size:13px;margin:10px 0;padding-left:23px}
            .heroCard .btn{width:100%;padding:13px 18px;font-size:13px}
            .dealCountdown{height:54px;gap:3px;padding:0 7px}
            .dealLead,.dealEnd{font-size:9px}
            .dealUnits{gap:2px}
            .dealUnit{width:31px;height:34px;border-radius:4px}
            .dealUnit b{font-size:12px}
            .dealUnit span{font-size:6px;margin-top:3px}
            .dealColon{font-size:12px}
            .categoryNavInner{min-width:max-content;justify-content:flex-start;gap:7px;padding:10px 12px}
            .pill{padding:8px 13px;font-size:10px}
            .section{padding:38px 0}
            .container{padding-left:12px;padding-right:12px}
            .homeHead h2{font-size:26px}
            .homeHead p{font-size:12px;line-height:1.45}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
            .card{padding:6px;border-radius:12px}
            .card img{border-radius:8px}
            .card h3{font-size:12px;line-height:1.25;margin:7px 2px}
            .price{font-size:11px;margin:7px 2px 9px}
            .price b{font-size:13px}
            .price del{margin-left:3px}
            .card .btn{font-size:10px;padding:9px 5px;border-radius:22px}
            .reviews{padding-bottom:28px}
            .reviewsHead{margin-bottom:20px}
            .reviewsHead h2{font-size:28px;margin:6px 0}
            .reviewsHead p{font-size:12px;margin:0 8px}
            .reviewTrack{gap:12px;padding:3px 1px 14px}
            .review{flex-basis:280px;width:280px;border-radius:16px}
            .review>img{height:250px}
            .reviewBody{padding:14px 15px 17px}
            .reviewBody p{font-size:12px;min-height:62px}
            .reviewBody strong{font-size:12px}
            .reviewBody span{font-size:10px}
            .pawluv-how-order{padding:18px 0 26px}
            .pawluv-how-order .howWrap{padding:0 8px}
            .pawluv-how-order img{border-radius:12px;box-shadow:0 8px 22px rgba(37,38,63,.06)}
          }
          @media(max-width:360px){
            .logo img{width:128px}
            .actions{font-size:9px}
            .hero h1{font-size:29px}
            .grid{gap:7px}
            .card h3{font-size:11px}
            .review{flex-basis:260px;width:260px}
          }
          </style>'''
          marker='</body>'
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO MOBILE POLISH: premium responsive layout"
          git push