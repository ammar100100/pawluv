name: Pawluv Mobile Responsive Polish v3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO MOBILE POLISH') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium mobile v3 layout
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="pawluv-mobile-polish">.*?</style>', '', s, flags=re.S)
          css='''<style id="pawluv-mobile-polish">
          html,body{max-width:100%;overflow-x:hidden}
          body{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
          img{max-width:100%;height:auto}
          .container{width:100%;max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
          .hero{overflow:hidden}
          .heroCard{width:min(520px,100%)}
          .dealCountdown{overflow:hidden}
          .categoryNav{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
          .categoryNav::-webkit-scrollbar{display:none}
          .categoryNavInner{width:max-content;min-width:100%;justify-content:center}
          .reviewTrack{width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
          .reviewTrack::-webkit-scrollbar{display:none}
          .review{flex:0 0 330px}
          .grid{width:100%}
          .card{min-width:0;overflow:hidden}
          .card h3{overflow-wrap:anywhere}
          .pawluv-how-order{width:100%;overflow:hidden}
          .pawluv-how-order .howWrap{width:100%}
          .pawluv-how-order img{width:100%;height:auto}
          @media(max-width:900px){
            .nav{height:auto;min-height:68px;padding:10px 16px;gap:10px;flex-wrap:wrap;position:relative}
            .logo{flex:1 1 auto;min-width:0}
            .logo img{width:158px;max-height:46px}
            .actions{gap:8px;font-size:10px;font-weight:800;white-space:nowrap}
            .navlinks{display:flex;order:3;width:100%;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
            .navlinks::-webkit-scrollbar{display:none}
            .navlinks a{flex:0 0 auto;padding:7px 11px;border:1px solid #eee;border-radius:99px;background:#fff;font-size:9px;letter-spacing:.3px}
            .hero{min-height:600px;padding:28px 16px;background-position:center center}
            .heroCard{padding:32px 26px;border-radius:18px;margin:0 auto}
            .hero h1{font-size:39px}
            .hero p{font-size:16px}
            .section{padding:46px 0}
            .container{padding-left:16px;padding-right:16px}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
            .card{padding:8px;border-radius:14px}
            .card img{width:100%;aspect-ratio:1;object-fit:cover}
            .card h3{font-size:14px}
            .price{font-size:13px;margin:8px 0 10px}
            .card .btn{font-size:12px;padding:11px 8px}
            .homeHead{display:block;margin-bottom:20px}
            .homeHead h2{font-size:30px}
            .count{margin-top:8px}
            .reviewsHead h2{font-size:34px}
            .reviewsHead p{font-size:14px}
            .review{flex-basis:300px;width:300px}
            .review>img{height:275px}
            .dealCountdown{height:60px;gap:5px;padding:0 10px}
            .dealLead,.dealEnd{font-size:11px}
            .dealUnit{width:38px;height:38px}
            .dealUnit b{font-size:14px}
            .dealUnit span{font-size:7px}
            .dealColon{font-size:15px}
          }
          @media(max-width:560px){
            .promo{height:38px;font-size:10px;letter-spacing:.1px;padding:0 8px;text-align:center;white-space:nowrap}
            .nav{min-height:92px;padding:8px 12px 9px}
            .logo img{width:132px;max-height:40px}
            .actions{font-size:9px;gap:5px}
            .navlinks{gap:6px}
            .navlinks a{font-size:8px;padding:6px 9px}
            .hero{min-height:530px;padding:18px 12px;background-position:62% center}
            .heroCard{padding:25px 19px;width:100%;max-width:420px;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.10)}
            .heroCard .stars{font-size:15px}
            .hero h1{font-size:31px;line-height:1.04;margin:13px 0}
            .hero p{font-size:14px;line-height:1.5}
            .heroCard ul{margin:16px 0}
            .heroCard li{font-size:12.5px;margin:9px 0;padding-left:22px}
            .heroCard .btn{width:100%;padding:13px 18px;font-size:13px;text-align:center}
            .dealCountdown{height:54px;gap:3px;padding:0 6px}
            .dealLead,.dealEnd{font-size:8px}
            .dealUnits{gap:2px}
            .dealUnit{width:31px;height:34px;border-radius:4px}
            .dealUnit b{font-size:12px}
            .dealUnit span{font-size:6px;margin-top:3px}
            .dealColon{font-size:12px}
            .categoryNavInner{min-width:max-content;justify-content:flex-start;gap:7px;padding:9px 12px}
            .pill{padding:8px 12px;font-size:9px}
            .section{padding:34px 0}
            .container{padding-left:11px;padding-right:11px}
            .homeHead{margin-bottom:17px}
            .homeHead h2{font-size:25px;line-height:1.1}
            .homeHead p{font-size:11.5px;line-height:1.45;max-width:310px}
            .count{font-size:9px}
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
            .card{padding:5px;border-radius:12px;box-shadow:0 3px 14px rgba(37,38,63,.07)}
            .card img{border-radius:8px}
            .card .stars{font-size:9px;letter-spacing:1px;margin:7px 2px 0}
            .card h3{font-size:11px;line-height:1.25;margin:6px 2px;min-height:28px}
            .price{font-size:10px;margin:6px 2px 8px;white-space:nowrap}
            .price b{font-size:12px}
            .price del{font-size:9px;margin-left:2px}
            .card .btn{font-size:9px;padding:9px 4px;border-radius:20px;letter-spacing:.1px}
            .reviews{padding-bottom:25px}
            .reviewsHead{margin-bottom:18px}
            .reviewsHead h2{font-size:27px;margin:5px 0}
            .reviewsHead p{font-size:11.5px;margin:0 6px}
            .reviewTrack{gap:10px;padding:3px 1px 12px}
            .review{flex-basis:270px;width:270px;border-radius:15px}
            .review>img{height:240px}
            .reviewBody{padding:13px 14px 16px}
            .reviewBody p{font-size:11.5px;min-height:58px}
            .reviewBody strong{font-size:11.5px}
            .reviewBody span{font-size:9.5px}
            .pawluv-how-order{padding:16px 0 24px}
            .pawluv-how-order .howWrap{padding:0 8px}
            .pawluv-how-order img{border-radius:11px;box-shadow:0 8px 22px rgba(37,38,63,.06)}
          }
          @media(max-width:360px){
            .logo img{width:120px}
            .actions{font-size:8px}
            .navlinks a{font-size:7.5px;padding:6px 8px}
            .hero h1{font-size:28px}
            .grid{gap:7px}
            .card h3{font-size:10.5px}
            .card .btn{font-size:8.5px}
            .review{flex-basis:250px;width:250px}
          }
          </style>'''
          marker='</head>'
          if marker not in s:
              raise SystemExit('head marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO MOBILE POLISH: premium responsive v3"
          git push