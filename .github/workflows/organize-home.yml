name: Organize Pawluv Homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO HOME') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build organized homepage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          hero_end=s.find('</section>', s.find('<section class="hero"'))
          if hero_end<0: raise SystemExit('hero not found')
          hero_end += len('</section>')
          footer_pos=s.find('<footer')
          if footer_pos<0: raise SystemExit('footer not found')
          before=s[:hero_end]
          after=s[footer_pos:]
          cat_area=s[hero_end:footer_pos]
          cards=re.findall(r'<article class="card">.*?</article>',cat_area,re.S)
          seen=set(); clean_cards=[]
          for c in cards:
            m=re.search(r'href="(/product/[^/]+/)',c)
            key=m.group(1) if m else c
            if key not in seen:
              seen.add(key); clean_cards.append(c)
          cards=clean_cards
          new_products=[
            ('Engraved Pet Portrait Necklace','Engraved-Pet-Portrait-Necklace3','https://easyorders.fra1.digitaloceanspaces.com/1782319400875497952.avif',1099,1499),
            ('Engraved Pet Portrait Necklace 2 pets','Engraved-Pet-Portrait-Necklace2','https://easyorders.fra1.digitaloceanspaces.com/1782316173944078722.jpg',790,1399),
            ('Engraved Pet Portrait Necklace','Engraved-Pet-Portrait-Necklace','https://easyorders.fra1.digitaloceanspaces.com/1782309455352170521.webp',699,1099),
          ]
          for name,slug,img,sale,price in new_products:
            if not any(f'/product/{slug}/' in c for c in cards):
              cards.append(f'<article class="card"><a href="/product/{slug}/"><img src="{img}" alt="{name}"></a><div class="stars">★★★★★</div><h3><a href="/product/{slug}/">{name}</a></h3><div class="price"><b>EGP {sale}</b> <del>EGP {price}</del></div><a class="btn" href="/product/{slug}/">VIEW PRODUCT</a></article>')
          groups={'necklaces':[],'bracelets':[],'keychains':[],'mugs':[],'portraits':[]}
          for c in cards:
            t=re.sub('<[^>]+>',' ',c).lower()
            if 'necklace' in t: g='necklaces'
            elif 'bracelet' in t: g='bracelets'
            elif 'keychain' in t: g='keychains'
            elif 'portrait' in t and 'mug' not in t: g='portraits'
            else: g='mugs'
            groups[g].append(c)
          labels={'necklaces':('Pet Necklaces','Personalized necklaces made from your pet photo.'),'bracelets':('Pet Portrait Bracelets','Keep your favorite pets close with personalized engraving.'),'keychains':('Custom Pet Keychains','A personalized keepsake you can carry everywhere.'),'mugs':('Custom Pet Mugs','Make every coffee break a little more personal.'),'portraits':('Pet Portraits','Beautiful custom artwork made from your favorite photo.')}
          nav='''<div class="categoryNav" id="home-organized"><div class="categoryNavInner"><a class="pill" href="#necklaces">Necklaces</a><a class="pill" href="#bracelets">Bracelets</a><a class="pill" href="#keychains">Keychains</a><a class="pill" href="#mugs">Mugs</a><a class="pill" href="#portraits">Pet Portraits</a><a class="pill" href="#reviews">Reviews</a></div></div>'''
          secs=[]
          for i,k in enumerate(groups):
            title,desc=labels[k]
            cls='alt' if i%2 else ''
            secs.append(f'<section class="section homeCat {cls}" id="{k}"><div class="container"><div class="homeHead"><div><span class="eyebrow">PAWLUV COLLECTION</span><h2>{title}</h2><p>{desc}</p></div><span class="count">{len(groups[k])} PRODUCTS</span></div><div class="grid">{"".join(groups[k])}</div></div></section>')
          review_match=re.search(r'<section class="section reviews" id="reviews">.*?</section>',s,re.S)
          review_sec=review_match.group(0) if review_match else ''
          css='''<style id="home-sections-css">.categoryNav{position:sticky;top:70px;z-index:30;background:#fff;border-bottom:1px solid #e9e9e9;overflow:auto}.categoryNavInner{max-width:1240px;margin:auto;display:flex;justify-content:center;gap:9px;padding:12px 20px;white-space:nowrap}.pill{border:1px solid #ddd;border-radius:99px;padding:9px 17px;font-size:11px;font-weight:800}.homeCat{scroll-margin-top:125px}.homeCat.alt{background:#faf7f6}.homeHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#ff8fa7}.homeHead h2{font:700 34px Georgia,serif;color:#25263f;margin:7px 0}.homeHead p{margin:0;color:#777;font-size:14px}.count{font-size:11px;font-weight:800;color:#777;white-space:nowrap}.reviews{background:#fdf0f5;overflow:hidden}.reviewsHead{text-align:center;margin-bottom:32px}.reviewsHead h2{font:700 40px Georgia,serif;color:#25263f;margin:8px 0}.reviewsHead p{color:#777}.reviewTrack{display:flex;gap:20px;overflow-x:auto;padding:5px 2px 20px;scroll-snap-type:x mandatory}.review{min-width:330px;width:330px;background:#fff;border-radius:20px;overflow:hidden;border:1px solid #eee;scroll-snap-align:start}.review>img{width:100%;height:300px;object-fit:cover;display:block}.reviewBody{padding:18px 20px 22px}.reviewStars{color:#f4b400;letter-spacing:2px;font-size:13px;margin-bottom:9px}.reviewBody p{font-size:14px;line-height:1.55;min-height:70px;margin:0 0 15px;color:#444}.reviewBody strong{font-size:13px}.reviewBody span{display:block;font-size:11px;color:#777;margin-top:7px}@media(max-width:900px){.categoryNavInner{justify-content:flex-start}.homeHead{align-items:start}.review{min-width:290px;width:290px}}@media(max-width:560px){.homeHead h2{font-size:28px}.review>img{height:290px}}</style>'''
          new=before+css+nav+review_sec+''.join(secs)+after
          p.write_text(new,encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO HOME: remove all-products block and reorder categories"
          git push
