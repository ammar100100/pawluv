name: Organize Pawluv Homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO HOME') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build organized homepage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="home-organized"' in s: raise SystemExit(0)
          m=re.search(r'<section class="section soft" id="shop">.*?</section><footer',s,re.S)
          if not m: raise SystemExit('shop section not found')
          shop=m.group(0)
          cards=re.findall(r'<article class="card">.*?</article>',shop,re.S)
          groups={'necklaces':[],'bracelets':[],'mugs':[],'keychains':[],'portraits':[]}
          for c in cards:
            t=re.sub('<[^>]+>',' ',c).lower()
            if 'necklace' in t: g='necklaces'
            elif 'bracelet' in t: g='bracelets'
            elif 'keychain' in t: g='keychains'
            elif 'portrait' in t and 'mug' not in t: g='portraits'
            else: g='mugs'
            groups[g].append(c)
          labels={'necklaces':('Pet Necklaces','Personalized necklaces made from your pet photo.'),'bracelets':('Pet Portrait Bracelets','Keep your favorite pets close with personalized engraving.'),'mugs':('Custom Pet Mugs','Make every coffee break a little more personal.'),'keychains':('Custom Pet Keychains','A personalized keepsake you can carry everywhere.'),'portraits':('Pet Portraits','Beautiful custom artwork made from your favorite photo.')}
          nav='''<div class="categoryNav" id="home-organized"><div class="categoryNavInner"><a class="pill" href="#necklaces">Necklaces</a><a class="pill" href="#bracelets">Bracelets</a><a class="pill" href="#mugs">Mugs</a><a class="pill" href="#keychains">Keychains</a><a class="pill" href="#portraits">Pet Portraits</a><a class="pill" href="#reviews">Reviews</a></div></div>'''
          secs=[]
          for i,k in enumerate(groups):
            title,desc=labels[k]
            secs.append(f'<section class="section homeCat {"alt" if i%2 else ""}" id="{k}"><div class="container"><div class="homeHead"><div><span class="eyebrow">PAWLUV COLLECTION</span><h2>{title}</h2><p>{desc}</p></div><span class="count">{len(groups[k])} PRODUCTS</span></div><div class="grid">{"".join(groups[k])}</div></div></section>')
          reviews=[('1782504680440702885.webp','Fast shipping for a custom made necklace from another country I cannot wait to wear this everyday','Jana yasser'),('1782506025213506549.avif','Absolutely loved the final result. Beautiful details and amazing quality.','Sarah'),('1782505129726203311.avif','Perfect gift for pet lovers. Everyone who saw it asked where I got it.','Mariam maged'),('1782502741568172511.webp','Nala was my best friend and my rock. I lost her a week after I got my portrait.','Becky'),('1782502633700399501.webp','Absolutely loved the final result. Beautiful details and amazing quality.','Sarah'),('1782504414963687448.webp','Thank you so much. Both of my babies are gone so this is something I will wear everyday 🖤','Nada tarek'),('1782504475673418880.webp','Absolutely LOVE this necklace!! It is so perfect and I’ve already gotten so many compliments on this!','Salma Salah'),('1782501462623607507.avif','I am so happy, this is the best gift I could have given myself.','Christen Rashad'),('1782502324907656158.webp','Very impressed! Exactly what I wanted to remember my pup ❤️ thank you','Mohammed Nasser'),('1782506703315783184.avif','Great customer service and beautiful execution','Verified Customer')]
          rv=''.join(f'<article class="review"><img src="https://files.easy-orders.net/{im}" alt="{name} review" loading="lazy"><div class="reviewBody"><div class="reviewStars">★★★★★</div><p>“{txt}”</p><strong>{name}</strong><span>✓ Verified Customer</span></div></article>' for im,txt,name in reviews)
          review_sec=f'<section class="section reviews" id="reviews"><div class="container"><div class="reviewsHead"><span class="eyebrow">REAL PAWLUV LOVE</span><h2>What Pet Parents Say</h2><p>Real feedback from Pawluv customers.</p></div><div class="reviewTrack">{rv}</div></div></section>'
          css='''<style id="home-sections-css">.categoryNav{position:sticky;top:70px;z-index:30;background:#fff;border-bottom:1px solid #e9e9e9;overflow:auto}.categoryNavInner{max-width:1240px;margin:auto;display:flex;justify-content:center;gap:9px;padding:12px 20px;white-space:nowrap}.pill{border:1px solid #ddd;border-radius:99px;padding:9px 17px;font-size:11px;font-weight:800}.homeCat{scroll-margin-top:125px}.homeCat.alt{background:#faf7f6}.homeHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#ff8fa7}.homeHead h2{font:700 34px Georgia,serif;color:#25263f;margin:7px 0}.homeHead p{margin:0;color:#777;font-size:14px}.count{font-size:11px;font-weight:800;color:#777;white-space:nowrap}.reviews{background:#fdf0f5;overflow:hidden}.reviewsHead{text-align:center;margin-bottom:32px}.reviewsHead h2{font:700 40px Georgia,serif;color:#25263f;margin:8px 0}.reviewsHead p{color:#777}.reviewTrack{display:flex;gap:20px;overflow-x:auto;padding:5px 2px 20px;scroll-snap-type:x mandatory}.review{min-width:330px;width:330px;background:#fff;border-radius:20px;overflow:hidden;border:1px solid #eee;scroll-snap-align:start}.review>img{width:100%;height:300px;object-fit:cover;display:block}.reviewBody{padding:18px 20px 22px}.reviewStars{color:#f4b400;letter-spacing:2px;font-size:13px;margin-bottom:9px}.reviewBody p{font-size:14px;line-height:1.55;min-height:70px;margin:0 0 15px;color:#444}.reviewBody strong{font-size:13px}.reviewBody span{display:block;font-size:11px;color:#777;margin-top:7px}@media(max-width:900px){.categoryNavInner{justify-content:flex-start}.homeHead{align-items:start}.review{min-width:290px;width:290px}}@media(max-width:560px){.homeHead h2{font-size:28px}.review>img{height:290px}}</style>'''
          start=shop[:shop.index('<div class="container">')]
          # keep the existing footer and everything after the shop section
          footer_pos=m.end()-len('<footer')
          before=s[:m.start()]
          after=s[footer_pos:]
          featured='<section class="section soft" id="shop"><div class="container"><h2 class="title">Shop Pawluv</h2><p style="text-align:center;color:#777;margin-top:-20px;margin-bottom:35px">Discover our custom pet keepsakes.</p><div class="grid">'+''.join(cards[:8])+'</div></div></section>'
          new=before+css+nav+featured+''.join(secs)+review_sec+after
          p.write_text(new,encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO HOME: organize products and reviews"
          git push
