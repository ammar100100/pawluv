name: Pawluv Homepage Design
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  design:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO HOME DESIGN') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage design
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          hero='''<section class="hero"><div class="heroCard"><div class="stars">★★★★★</div><h1>One-of-a-kind Custom Pet Portraits</h1><p>Turn your favorite pet photo into a beautiful keepsake made especially for you.</p><ul><li>Personalized gifts for pet parents</li><li>Free art proofs &amp; revisions</li><li>Hand-illustrated from your pet photo</li></ul><a class="btn" href="#shop">SHOP NOW →</a></div></section>'''
          s=re.sub(r'<section class="hero">.*?</section>',hero,s,count=1,flags=re.S)
          css='''<style id="pawluv-design-update">.promo{height:42px;font-size:14px;background:#ff91aa}.nav{height:76px;padding:0 5.2%;position:relative}.logo{font-size:25px}.navlinks{gap:30px;font-size:12px}.hero{min-height:650px;padding:0 5.5%;display:flex;align-items:center;justify-content:flex-start;background:linear-gradient(90deg,rgba(248,243,241,.98) 0%,rgba(248,243,241,.76) 39%,rgba(248,243,241,.08) 63%),url('https://unsplash.com/photos/vuXSDvz_Vo0/download?force=true&w=1800') center/cover no-repeat;position:relative}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.22),transparent 60%);pointer-events:none}.heroCard{position:relative;z-index:1;max-width:520px;text-align:left;background:rgba(255,255,255,.9);padding:42px 40px;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.heroCard .stars{color:#ff8fa7;font-size:17px}.hero h1{font-size:48px;line-height:1.02;margin:18px 0}.hero p{font-size:17px;color:#333;line-height:1.55}.heroCard ul{list-style:none;padding:0;margin:22px 0}.heroCard li{font-size:16px;margin:13px 0;padding-left:28px;position:relative}.heroCard li:before{content:"✓";position:absolute;left:0;color:#ff8fa7;font-weight:900}.heroCard .btn{padding:15px 30px;border-radius:30px;font-size:15px}body{display:flex;flex-direction:column}.promo{order:1}.nav{order:2}.hero{order:3}.reviews{order:4}.categoryNav{order:5}.section.soft{order:6}.homeCat{order:7}.footer{order:99}@media(max-width:900px){.hero{min-height:620px;padding:35px 20px}.heroCard{max-width:560px}.hero h1{font-size:40px}}@media(max-width:560px){.promo{font-size:12px}.nav{height:62px}.hero{min-height:570px;padding:25px 16px;background-position:center}.heroCard{padding:30px 24px}.hero h1{font-size:34px}.hero p{font-size:15px}.heroCard li{font-size:14px}}</style>'''
          if 'id="pawluv-design-update"' not in s:
            s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO HOME DESIGN: hero and reviews layout"
          git push
