name: Organize Pawluv Homepage
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  organize:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO HOME') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build organized homepage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          hero_start=s.find('<section class="hero"')
          hero_end=s.find('</section>', hero_start)
          if hero_start<0 or hero_end<0: raise SystemExit('hero not found')
          hero_end += len('</section>')
          footer_pos=s.find('<footer')
          if footer_pos<0: raise SystemExit('footer not found')
          head=s[:hero_start]
          hero=s[hero_start:hero_end]
          head=re.sub(r'<div class="dealCountdown".*?</div>','',head,flags=re.S)
          head=head.replace('EXTRA 25% OFF OUR BEST SELLERS','FREE DESIGN PREVIEW • EXTRA 25% OFF OUR BEST SELLERS')
          head=re.sub(r'<a class="logo" href="/">.*?</a>', '<a class="logo" href="/"><img src="/assets/pawluv-logo.svg" alt="Pawluv" /></a>', head, count=1, flags=re.S)
          after=s[footer_pos:]
          cat_area=s[hero_end:footer_pos]
          cards=re.findall(r'<article class="card">.*?</article>',cat_area,re.S)
          seen=set(); clean_cards=[]
          for c in cards:
            m=re.search(r'href="(/product/[^/]+/)',c)
            key=m.group(1) if m else c
            if key not in seen:
              seen.add(key); clean_cards.append(c)
          cards=clean_cards
          new_products=[
            ('Engraved Pet Portrait Necklace','Engraved-Pet-Portrait-Necklace3','https://easyorders.fra1.digitaloceanspaces.com/1782319400875497952.avif',1099,1499),
            ('Engraved Pet Portrait Necklace 2 pets','Engraved-Pet-Portrait-Necklace2','https://easyorders.fra1.digitaloceanspaces.com/1782316173944078722.jpg',790,1399),
            ('Engraved Pet Portrait Necklace','Engraved-Pet-Portrait-Necklace','https://easyorders.fra1.digitaloceanspaces.com/1782309455352170521.webp',699,1099),
          ]
          for name,slug,img,sale,price in new_products:
            if not any(f'/product/{slug}/' in c for c in cards):
              cards.append(f'<article class="card"><a href="/product/{slug}/"><img src="{img}" alt="{name}"></a><div class="stars">★★★★★</div><h3><a href="/product/{slug}/">{name}</a></h3><div class="price"><b>EGP {sale}</b> <del>EGP {price}</del></div><a class="btn" href="/product/{slug}/">VIEW PRODUCT</a></article>')
          groups={'necklaces':[],'bracelets':[],'keychains':[],'mugs':[],'portraits':[]}
          for c in cards:
            t=re.sub('<[^>]+>',' ',c).lower()
            if 'necklace' in t: g='necklaces'
            elif 'bracelet' in t: g='bracelets'
            elif 'keychain' in t: g='keychains'
            elif 'portrait' in t and 'mug' not in t: g='portraits'
            else: g='mugs'
            groups[g].append(c)
          labels={'necklaces':('Pet Necklaces','Personalized necklaces made from your pet photo.'),'bracelets':('Pet Portrait Bracelets','Keep your favorite pets close with personalized engraving.'),'keychains':('Custom Pet Keychains','A personalized keepsake you can carry everywhere.'),'mugs':('Custom Pet Mugs','Make every coffee break a little more personal.'),'portraits':('Pet Portraits','Beautiful custom artwork made from your favorite photo.')}
          nav='''<div class="categoryNav" id="home-organized"><div class="categoryNavInner"><a class="pill" href="#necklaces">Necklaces</a><a class="pill" href="#bracelets">Bracelets</a><a class="pill" href="#keychains">Keychains</a><a class="pill" href="#mugs">Mugs</a><a class="pill" href="#portraits">Pet Portraits</a><a class="pill" href="#reviews">Reviews</a></div></div>'''
          secs=[]
          for i,k in enumerate(groups):
            title,desc=labels[k]
            cls='alt' if i%2 else ''
            secs.append(f'<section class="section homeCat {cls}" id="{k}"><div class="container"><div class="homeHead"><div><span class="eyebrow">PAWLUV COLLECTION</span><h2>{title}</h2><p>{desc}</p></div><span class="count">{len(groups[k])} PRODUCTS</span></div><div class="grid">{"".join(groups[k])}</div></div></section>')
          review_match=re.search(r'<section class="section reviews" id="reviews">.*?</section>',s,re.S)
          review_sec=review_match.group(0) if review_match else ''
          css='''<style id="home-sections-css">.categoryNav{position:sticky;top:70px;z-index:30;background:#fff;border-bottom:1px solid #e9e9e9;overflow:auto}.categoryNavInner{max-width:1240px;margin:auto;display:flex;justify-content:center;gap:9px;padding:12px 20px;white-space:nowrap}.pill{border:1px solid #ddd;border-radius:99px;padding:9px 17px;font-size:11px;font-weight:800}.homeCat{scroll-margin-top:125px}.homeCat.alt{background:#faf7f6}.homeHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:800;color:#ff8fa7}.homeHead h2{font:700 34px Georgia,serif;color:#25263f;margin:7px 0}.homeHead p{margin:0;color:#777;font-size:14px}.count{font-size:11px;font-weight:800;color:#777;white-space:nowrap}.reviews{background:#fdf0f5;overflow:hidden}.reviewsHead{text-align:center;margin-bottom:32px}.reviewsHead h2{font:700 40px Georgia,serif;color:#25263f;margin:8px 0}.reviewsHead p{color:#777}.reviewTrack{display:flex;gap:20px;overflow-x:auto;padding:5px 2px 20px;scroll-snap-type:x mandatory}.review{min-width:330px;width:330px;background:#fff;border-radius:20px;overflow:hidden;border:1px solid #eee;scroll-snap-align:start}.review>img{width:100%;height:300px;object-fit:cover;display:block}.reviewBody{padding:18px 20px 22px}.reviewStars{color:#f4b400;letter-spacing:2px;font-size:13px;margin-bottom:9px}.reviewBody p{font-size:14px;line-height:1.55;min-height:70px;margin:0 0 15px;color:#444}.reviewBody strong{font-size:13px}.reviewBody span{display:block;font-size:11px;color:#777;margin-top:7px}.dealCountdown{height:64px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:900;letter-spacing:.2px;position:relative;z-index:25}.dealLead,.dealEnd{white-space:nowrap}.dealUnits{display:flex;align-items:center;gap:7px}.dealUnit{width:44px;height:43px;background:#fff;color:#111;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}.dealUnit b{font-size:17px}.dealUnit span{font-size:9px;font-weight:700;margin-top:4px}.dealColon{font-size:20px}.dealFree{position:absolute;left:24px;font-size:11px;letter-spacing:1.3px;color:#fff;opacity:.9}.logo img{display:block;width:190px;height:auto;max-height:54px;object-fit:contain;object-position:left center}@media(max-width:900px){.categoryNavInner{justify-content:flex-start}.homeHead{align-items:start}.review{min-width:290px;width:290px}.dealFree{display:none}.dealCountdown{gap:6px;font-size:13px}.dealUnit{width:39px;height:40px}}@media(max-width:560px){.homeHead h2{font-size:28px}.review>img{height:290px}.dealCountdown{height:58px;gap:4px;font-size:10px}.dealUnits{gap:3px}.dealUnit{width:34px;height:36px}.dealUnit b{font-size:13px}.dealUnit span{font-size:7px}.dealColon{font-size:14px}.logo img{width:150px;max-height:44px}}</style>'''
          countdown='''<div class="dealCountdown" id="dealCountdown"><span class="dealFree">FREE DESIGN PREVIEW</span><span class="dealLead">ORDER BY</span><div class="dealUnits"><div class="dealUnit"><b id="dd">04</b><span>DAYS</span></div><span class="dealColon">:</span><div class="dealUnit"><b id="hh">22</b><span>HRS</span></div><span class="dealColon">:</span><div class="dealUnit"><b id="mm">47</b><span>MIN</span></div><span class="dealColon">:</span><div class="dealUnit"><b id="ss">31</b><span>SEC</span></div></div><span class="dealEnd">FOR 25% OFF</span></div>'''
          script='''<script>(function(){const key='pawluv_deal_deadline_v1';let target=localStorage.getItem(key);if(!target){target=Date.now()+((4*24+22)*60*60+47*60+31)*1000;localStorage.setItem(key,target)}function tick(){let left=Math.max(0,Number(target)-Date.now());let sec=Math.floor(left/1000);let d=Math.floor(sec/86400);sec%=86400;let h=Math.floor(sec/3600);sec%=3600;let m=Math.floor(sec/60);let ss=sec%60;document.getElementById('dd').textContent=String(d).padStart(2,'0');document.getElementById('hh').textContent=String(h).padStart(2,'0');document.getElementById('mm').textContent=String(m).padStart(2,'0');document.getElementById('ss').textContent=String(ss).padStart(2,'0');if(left<=0)localStorage.removeItem(key)}tick();setInterval(tick,1000)})();</script>'''
          new=head+countdown+hero+css+nav+review_sec+''.join(secs)+after+script
          p.write_text(new,encoding='utf-8')
          PY
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "AUTO HOME: add official Pawluv logo"
          git push
