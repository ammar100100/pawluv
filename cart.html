<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8fa8"><title>Your Cart | Pawluv</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:"DM Sans",Arial,sans-serif;color:#252740;background:#fff8fa}.top{background:#252740;color:#fff;text-align:center;padding:9px;font-size:13px}.nav{height:68px;position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1200px)/2))}.logo{font-size:26px;font-weight:900;text-decoration:none;color:#252740}.logo span{color:#ff8fa8}.nav a{text-decoration:none;font-weight:800;color:#252740}.wrap{max-width:1200px;margin:auto;padding:38px 18px 80px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h1{font-size:38px;margin:0}.head p{margin:7px 0 0;color:#777}.layout{display:grid;grid-template-columns:1fr 370px;gap:28px}.items,.summary{background:#fff;border:1px solid #eee;border-radius:24px;box-shadow:0 12px 40px rgba(37,39,64,.05)}.items{padding:8px 22px}.item{display:grid;grid-template-columns:105px 1fr auto;gap:18px;padding:20px 0;border-bottom:1px solid #eee;align-items:center}.item:last-child{border-bottom:0}.item img{width:105px;height:105px;object-fit:cover;border-radius:18px;background:#f7f7f8}.name{font-weight:900;font-size:17px}.muted{color:#777;font-size:13px;margin-top:7px;line-height:1.5}.price{font-weight:900}.remove{border:0;background:none;color:#c43d61;cursor:pointer;padding:7px 0;font:inherit;font-size:13px}.summary{padding:24px;height:max-content;position:sticky;top:92px}.summary h2{margin-top:0}.row{display:flex;justify-content:space-between;margin:13px 0}.total{font-size:22px;font-weight:900;border-top:1px solid #eee;padding-top:17px;margin-top:18px}.deposit{background:#fff1f5;border-radius:15px;padding:15px;margin:17px 0;font-size:13px;line-height:1.5}.cta{display:block;width:100%;text-align:center;background:#ff8fa8;color:#fff;text-decoration:none;border-radius:14px;padding:16px;font-weight:900;box-shadow:0 10px 24px rgba(255,143,168,.25)}.continue{display:block;text-align:center;color:#252740;font-weight:800;text-decoration:none;margin-top:14px;font-size:14px}.empty{text-align:center;background:#fff;border:1px solid #eee;border-radius:24px;padding:80px 20px}.empty h2{margin-bottom:8px}.empty a{color:#252740;font-weight:900}@media(max-width:800px){.layout{grid-template-columns:1fr}.summary{position:static}.head{display:block}.head h1{font-size:31px}.item{grid-template-columns:78px 1fr}.item img{width:78px;height:78px}.item .right{grid-column:2;display:flex;justify-content:space-between;align-items:center}.items{padding:8px 15px}}</style></head><body><div class="top">Custom-made with love for your best friend 🐾</div><nav class="nav"><a class="logo" href="/">paw<span>luv</span></a><div><a href="/#shop">Shop</a><a href="/cart.html" style="margin-left:20px">Cart 🛒</a></div></nav><main class="wrap"><div class="head"><div><h1>Your Cart</h1><p>Everything looks better when it is made just for your pet.</p></div></div><div id="app"></div></main><script>const money=x=>new Intl.NumberFormat("en-US").format(x)+" EGP";function get(){try{return JSON.parse(localStorage.getItem("pawluv_cart")||"[]")}catch{return[]}}function render(){const c=get();if(!c.length){document.getElementById("app").innerHTML='<div class="empty"><h2>Your cart is empty</h2><p class="muted">Choose a Pawluv piece and make it personal.</p><a href="/#shop">Continue shopping</a></div>';return}const total=c.reduce((s,x)=>s+(Number(x.total)||0),0),dep=Math.round(total*.4);document.getElementById("app").innerHTML='<div class="layout"><section class="items">'+c.map((x,i)=>'<div class="item"><img src="'+(x.thumb||"")+'" alt=""><div><div class="name">'+x.name+'</div><div class="muted">Pet: '+(x.pet_name||"Not specified")+(x.photo_count? " · "+x.photo_count+" photo"+(x.photo_count>1?"s":""):"")+'<br>Quantity: '+x.quantity+'</div></div><div class="right"><div class="price">'+money(x.total)+'</div><button class="remove" onclick="removeItem('+i+')">Remove</button></div></div>').join("")+'</section><aside class="summary"><h2>Order Summary</h2><div class="row"><span>Subtotal</span><b>'+money(total)+'</b></div><div class="row total"><span>Total</span><span>'+money(total)+'</span></div><div class="deposit"><b>40% deposit due now</b><br>'+money(dep)+'<br><span style="color:#777">The remaining 60% is due after the order is ready.</span></div><a class="cta" href="/checkout.html">Continue to Checkout</a><a class="continue" href="/#shop">Continue shopping</a></aside></div>'}function removeItem(i){const c=get();c.splice(i,1);localStorage.setItem("pawluv_cart",JSON.stringify(c));render()}render();</script></body></html>
