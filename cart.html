<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff8fa8"><title>Your Cart | Pawluv</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#252740;background:#fff}.top{background:#252740;color:#fff;text-align:center;padding:9px;font-size:13px}.nav{height:66px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 max(16px,calc((100% - 1200px)/2))}.logo{font-size:26px;font-weight:900;text-decoration:none;color:#252740}.logo span{color:#ff8fa8}.nav a{text-decoration:none;font-weight:700;color:#252740}.wrap{max-width:1200px;margin:auto;padding:35px 18px 70px}.layout{display:grid;grid-template-columns:1fr 360px;gap:30px}.item{display:grid;grid-template-columns:110px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid #eee;align-items:center}.item img{width:110px;height:110px;object-fit:cover;border-radius:16px;background:#f7f7f8}.name{font-weight:900;font-size:18px}.muted{color:#777;font-size:13px;margin-top:7px}.price{font-weight:900}.remove{border:0;background:none;color:#c43d61;cursor:pointer}.summary{border:1px solid #eee;border-radius:20px;padding:22px;height:max-content;position:sticky;top:90px}.row{display:flex;justify-content:space-between;margin:12px 0}.total{font-size:21px;font-weight:900;border-top:1px solid #eee;padding-top:16px}.deposit{background:#fff4f7;border-radius:12px;padding:13px;margin:15px 0;font-size:13px}.cta{display:block;width:100%;text-align:center;background:#252740;color:#fff;text-decoration:none;border-radius:12px;padding:16px;font-weight:900}.empty{text-align:center;padding:80px 20px}.empty a{color:#252740;font-weight:900}@media(max-width:800px){.layout{grid-template-columns:1fr}.summary{position:static}.item{grid-template-columns:80px 1fr}.item img{width:80px;height:80px}.item .price{grid-column:2}}</style></head><body><div class="top">Custom-made with love for your best friend 🐾</div><nav class="nav"><a class="logo" href="/">paw<span>luv</span></a><div><a href="/#shop">Shop</a> <a href="/cart.html" style="margin-left:18px">Cart 🛒</a></div></nav><main class="wrap"><h1>Your Cart</h1><div id="app"></div></main><script>const money=x=>new Intl.NumberFormat('en-US').format(x)+' EGP';function render(){const c=JSON.parse(localStorage.getItem('pawluv_cart')||'[]');if(!c.length){document.getElementById('app').innerHTML='<div class="empty"><h2>Your cart is empty</h2><p class="muted">Choose a product from Pawluv and add it to your order.</p><a href="/#shop">Continue shopping</a></div>';return}let total=c.reduce((s,x)=>s+(Number(x.total)||0),0),dep=Math.round(total*.4);document.getElementById('app').innerHTML='<div class="layout"><section>'+c.map((x,i)=>'<div class="item"><img src="'+(x.thumb||'')+'" onerror="this.style.visibility=\'hidden\'"><div><div class="name">'+x.name+'</div><div class="muted">Pet: '+(x.pet_name||'Not specified')+' · Qty: '+x.quantity+'</div></div><div><div class="price">'+money(x.total)+'</div><button class="remove" onclick="removeItem('+i+')">Remove</button></div></div>').join('')+'</section><aside class="summary"><h2>Order Summary</h2><div class="row"><span>Subtotal</span><b>'+money(total)+'</b></div><div class="row total"><span>Total</span><span>'+money(total)+'</span></div><div class="deposit"><b>40% deposit due now:</b><br>'+money(dep)+'</div><a class="cta" href="/checkout.html">Continue to Checkout</a></aside></div>'}function removeItem(i){let c=JSON.parse(localStorage.getItem('pawluv_cart')||'[]');c.splice(i,1);localStorage.setItem('pawluv_cart',JSON.stringify(c));render()}render();</script></body></html>
