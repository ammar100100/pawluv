<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawluv — Admin</title><style>body{margin:0;background:#f5f1eb;color:#171614;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:45px 5%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font:400 44px Georgia,serif}.panel{background:#fff;border:1px solid #ded9d1;padding:25px;margin-top:25px}.btn{padding:12px 18px;background:#171614;color:#fff;border:0;cursor:pointer}.muted{color:#777;font-size:13px}.error{padding:18px;background:#fff;border:1px solid #d7c7b8}</style></head><body><main class="wrap"><div class="top"><div><div style="letter-spacing:3px;font-size:12px">PAWLUV</div><h1>Admin Dashboard</h1></div><button id="logout" class="btn">LOG OUT</button></div><div id="app" class="panel"><p class="muted">Checking your account…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://pmhjanbcwifyjqhyldni.supabase.co','sb_publishable_nag4MWRF1AprHCdc-cCkjA_XNTnHM2');const app=document.getElementById('app');async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('/login/');return}const {data:profile,error}=await sb.from('profiles').select('full_name,role').eq('id',user.id).single();if(error||profile?.role!=='admin'){app.innerHTML='<div class="error"><b>Access denied.</b><p class="muted">This account does not have administrator access.</p></div>';return}app.innerHTML='<h2>Welcome, '+(profile.full_name||user.email)+'</h2><p class="muted">Authenticated administrator session is active.</p><p class="muted">Orders and product management can be connected here next.</p>'}logout.onclick=async()=>{await sb.auth.signOut();location.replace('/login/')};guard();sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.replace('/login/')});</script></body></html>
