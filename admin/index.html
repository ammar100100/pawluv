<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pawluv — Admin Dashboard</title><style>:root{--ink:#171614;--cream:#f5f1eb;--line:#ded9d1;--muted:#77716a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:35px 5%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}h1,h2{font-family:Georgia,serif;font-weight:400}.panel{background:#fff;border:1px solid var(--line);padding:22px;margin-top:20px}.btn{padding:11px 16px;background:#171614;color:#fff;border:0;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 2fr;gap:20px}.row{border-top:1px solid var(--line);padding:16px 0}.row:first-child{border-top:0}.badge{display:inline-block;padding:5px 8px;background:#eee;font-size:10px;text-transform:uppercase}.controls{display:flex;gap:8px;flex-wrap:wrap}.select{padding:8px;border:1px solid #bbb}.muted{color:#777;font-size:12px;line-height:1.6}.danger{color:#a33}.stat{display:inline-block;margin-right:30px}.stat b{font-size:24px;display:block}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #ccc;margin:6px 0 12px}.notice{padding:12px;background:#f5f1eb;font-size:12px}.thumb{width:80px;height:80px;object-fit:cover;background:#eee;float:right}.orderhead{display:flex;justify-content:space-between;gap:15px}@media(max-width:850px){.grid{grid-template-columns:1fr}.thumb{float:none}}</style></head><body><main class="wrap"><div class="top"><div><div style="letter-spacing:3px;font-size:12px">PAWLUV</div><h1>Admin Dashboard</h1></div><div class="controls"><a class="btn" href="/">STORE</a><button id="logout" class="btn">LOG OUT</button></div></div><div id="app" class="panel">Checking your account…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://pmhjanbcwifyjqhyldni.supabase.co','sb_publishable_nag4MWRF1AprHCdc-cCkjA_XNTnHM2');let orders=[],products=[];const $=id=>document.getElementById(id);async function guard(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('/login/');return false}const {data:profile,error}=await sb.from('profiles').select('full_name,role').eq('id',user.id).single();if(error||profile?.role!=='admin'){$('app').innerHTML='<b>Access denied.</b><p class="muted">This account is not an administrator.</p>';return false}return true}async function load(){const ok=await guard();if(!ok)return;const [o,p]=await Promise.all([sb.from('orders').select('*,order_items(*)').order('created_at',{ascending:false}),sb.from('products').select('*').order('created_at',{ascending:false})]);if(o.error||p.error){$('app').innerHTML='<p class="danger">Could not load dashboard data.</p>';return}orders=o.data||[];products=p.data||[];render()}function render(){const revenue=orders.filter(x=>x.status!=='cancelled').reduce((s,x)=>s+Number(x.total||0),0);$('app').innerHTML='<div><div class="stat"><b>'+orders.length+'</b><span class="muted">ORDERS</span></div><div class="stat"><b>'+orders.filter(x=>x.status==='pending').length+'</b><span class="muted">PENDING</span></div><div class="stat"><b>EGP '+revenue+'</b><span class="muted">ORDER VALUE</span></div></div><div class="grid"><section class="panel"><h2>Add Product</h2><form id="productForm" class="form"><input id="pn" placeholder="Product name" required><input id="ps" placeholder="Slug" required><input id="pp" type="number" min="0" placeholder="Price" required><select id="pc"><option value="necklace">Necklace</option><option value="bracelet">Bracelet</option><option value="keychain">Keychain</option><option value="memorial">Memorial</option></select><input id="pi" placeholder="Image URL (optional)"><textarea id="pd" placeholder="Description"></textarea><button class="btn">ADD PRODUCT</button></form><h2>Products</h2><div id="productsList"></div></section><section class="panel"><h2>Orders</h2><div id="ordersList"></div></section></div>';renderProducts();renderOrders();$('productForm').onsubmit=addProduct}function renderProducts(){$('productsList').innerHTML=products.length?products.map(p=>'<div class="row"><b>'+escapeHtml(p.name)+'</b><br><span class="muted">EGP '+p.price+' · '+escapeHtml(p.category)+' · '+(p.active?'active':'hidden')+'</span><button class="btn" style="float:right" onclick="toggleProduct(\''+p.id+'\','+(!p.active)+')">'+(p.active?'HIDE':'SHOW')+'</button></div>').join(''):'<p class="muted">No products yet.</p>'}function renderOrders(){$('ordersList').innerHTML=orders.length?orders.map(o=>'<div class="row"><div class="orderhead"><b>#'+o.id.slice(0,8)+'</b><span class="badge">'+o.status+'</span></div><p class="muted">'+escapeHtml(o.customer_name)+' · '+escapeHtml(o.phone||'')+'<br>'+escapeHtml(o.address||'')+'<br>Total: <b>EGP '+o.total+'</b></p>'+((o.order_items||[]).map(i=>'<div class="notice">'+escapeHtml(i.product_name)+' · '+i.quantity+' · '+escapeHtml(i.pet_name||i.pet_names||'')+(i.photo_url?'<br><a href="'+encodeURI(i.photo_url)+'" target="_blank">View pet photo</a>':'')+'</div>').join(''))+'<div class="controls" style="margin-top:10px"><select class="select" onchange="setStatus(\''+o.id+'\',this.value)"><option '+(o.status==='pending'?'selected':'')+'>pending</option><option '+(o.status==='confirmed'?'selected':'')+'>confirmed</option><option '+(o.status==='in_production'?'selected':'')+'>in_production</option><option '+(o.status==='shipped'?'selected':'')+'>shipped</option><option '+(o.status==='delivered'?'selected':'')+'>delivered</option><option '+(o.status==='cancelled'?'selected':'')+'>cancelled</option></select></div></div>').join(''):'<p class="muted">No orders yet.</p>'}async function addProduct(e){e.preventDefault();const {error}=await sb.from('products').insert({name:$('pn').value,slug:$('ps').value,price:Number($('pp').value),category:$('pc').value,image_url:$('pi').value||null,description:$('pd').value||null,active:true});if(error)alert(error.message);else{alert('Product added');load()}}async function toggleProduct(id,active){const {error}=await sb.from('products').update({active}).eq('id',id);if(error)alert(error.message);else load()}async function setStatus(id,status){const {error}=await sb.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}function escapeHtml(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('/login/')}load();</script></body></html>
